<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/lumo-logo.png" />
    <link rel="apple-touch-icon" href="/lumo-logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;700&family=Orbitron:wght@700;800&family=Sora:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Lumo Edge</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #04060c;
        color: #e8eefc;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      .boot-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.22), transparent 55%),
          #04060c;
      }
      .boot-shell img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        object-fit: cover;
        box-shadow: 0 0 28px rgba(59, 130, 246, 0.35);
      }
      .boot-shell strong {
        font-family: Orbitron, Space Grotesk, sans-serif;
        letter-spacing: 0.06em;
        font-size: 1.15rem;
      }
      .boot-shell span {
        color: rgba(232, 238, 252, 0.55);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-busy="true">
        <img src="/lumo-logo.png" alt="" width="88" height="88" />
        <strong>Lumo Edge</strong>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
